api-path = "iozhtest/src/main/resources/tgbot.api"
fmt-config-path = "iozhtest/src/main/resources/.scalafmt.conf"
generate-gens = true
open-enum {
    enabled = true
    exclude-types = [ "MaybeInaccessibleMessage", "IFile" ]
}
custom-encoders = {
    "RichText" = """
      implicit lazy val richtextEncoder: Encoder[RichText] = {
        case plain: RichTextPlain => Json.fromString(plain.text)
        case concat: RichTextConcat => Json.arr(concat.texts.map(_.asJson): _*)
        case other => richtextGeneratedEncoder(other)
      }
    """
}
custom-decoders = {
    "MaybeInaccessibleMessage" = """
      implicit lazy val maybeinaccessiblemessageDecoder: Decoder[MaybeInaccessibleMessage] = {
        for {
          fDate <- Decoder[Long].prepare(_.downField("date"))
          value <- fDate match {
            case 0 => Decoder[InaccessibleMessage]
            case _ => Decoder[Message]
          }
        } yield value
      }
    """
    "RichText" = """
      implicit lazy val richtextDecoder: Decoder[iozhik.OpenEnum[RichText]] = Decoder.instance { c =>
        if (c.value.isString)
          c.as[String].map(s => iozhik.OpenEnum.Known(RichTextPlain(s)))
        else if (c.value.isArray)
          c.as[List[iozhik.OpenEnum[RichText]]].map(ts => iozhik.OpenEnum.Known(RichTextConcat(ts)))
        else
          richtextGeneratedDecoder(c)
      }
    """
}
# Overrides post-process the generated generator (`generated`) with `map`, never `suchThat`: filtering makes some
# samples come back empty. Each one needs a comment with its reason or a linked issue.
custom-gens = {
    # Telegram uses date == 0 to mark an inaccessible message, and the MaybeInaccessibleMessage decoder tells the two
    # apart by it, so a Message can't have it.
    "Message" = "generated.map(m => if (m.date == 0L) m.copy(date = 1L) else m)"
    # The other half of the same rule: an InaccessibleMessage always has date == 0.
    "InaccessibleMessage" = "generated.map(_.copy(date = 0))"
}
