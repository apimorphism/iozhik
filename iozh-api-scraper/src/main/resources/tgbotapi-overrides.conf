# Corrections to the Bot API docs, applied by TgBotApiScrapper: what it knows about a specific field or type that the
# docs don't say, or say wrongly. The scrape fails on an entry naming a field, method or type the docs no longer have,
# or using a setting where it doesn't apply.
# Give each entry, or group of entries, a comment with its reason: the doc wording, a Bot API server reference, an issue.
# An entry is for a field or type no rule in TgBotApiScrapper covers. When several entries share a reason, make that
# reason a rule there instead, so this file doesn't grow into a copy of the docs.

# A field key is Owner.name (a type's field or a method's param), or a bare name, for every field and param of that
# name. An Owner.name entry wins over a bare name one.
#
#   empty-vs-omitted = distinct | same
#     For an optional array. Telegram treats a missing optional array the same as an empty one, so it's tagged
#     (omitempty), and the encoder leaves an empty one out. `distinct` makes it an Option[List] instead, for arrays
#     where [] means something of its own. The scrape fails on an optional array whose description talks about empty
#     or omitted lists, until it's given one or the other.
#   integer = Int | Long
#     The width of an Integer (or of an array's). The scrape fails on an integer that looks like an identifier (named
#     *_id/*_ids, or described as an identifier) unless the docs say it may exceed 32 bits, its name classifies it
#     (user and chat IDs are Long; message, story and checklist task IDs are Int), or it's given here.
#   type = <DSL type>
#     Replaces the docs' type, written as a DSL type (e.g. List[Long], not "Array of Integer"): the scraper's
#     conversions from the docs' wording don't apply to it. It's still wrapped in an Option when optional. A field the docs link to "Sending files"
#     stays an IFile.
#   optional = true
#     For a field of a type with split-by-type: it stays optional in its variant ("Optional. For “X” only" otherwise
#     means required in variant X).
fields {
  # The docs give these as a String; ParseMode lists the values they name under "Formatting options".
  # sendPoll's question_parse_mode and description_parse_mode are parse modes too, but they stay Strings for now:
  # making them ParseMode changes telegramium's sendPoll.
  parse_mode { type = ParseMode }
  quote_parse_mode { type = ParseMode }
  explanation_parse_mode { type = ParseMode }
  text_parse_mode { type = ParseMode }

  # "If not specified, the previous setting will be used"
  "getUpdates.allowed_updates" { empty-vs-omitted = distinct }
  "setWebhook.allowed_updates" { empty-vs-omitted = distinct }
  # "If omitted, then all emoji reactions are allowed"
  "ChatFullInfo.available_reactions" { empty-vs-omitted = distinct }
  # Not in the docs: the Bot API server keeps the current areas when it's omitted, and removes them on [].
  "editStory.areas" { empty-vs-omitted = distinct }
  # These descriptions talk about empty or omitted lists, but mean the same by both.
  "sendPoll.country_codes" { empty-vs-omitted = same }
  "Poll.country_codes" { empty-vs-omitted = same }
  "Giveaway.country_codes" { empty-vs-omitted = same }
  "ChatFullInfo.active_usernames" { empty-vs-omitted = same }
  "WebhookInfo.allowed_updates" { empty-vs-omitted = same }

  # The docs rarely state an integer's width, and no naming rule covers these, so they're checked against the Bot API
  # server instead: telegram-bot-api Client.cpp at e3e9dd8 (Bot API 10.3), where each handler parses params and
  # serializes fields.
  # int64: parsed with to_integer<int64>, serialized from JsonDirectMessagesTopic.topic_id
  direct_messages_topic_id { integer = Long }
  # int64: parsed with to_integer<int64> in process_send_message_draft_query (the docs don't say)
  draft_id { integer = Long }
  # int32: get_forum_topic_id, serialized from td forum_topic_id:int32
  message_thread_id { integer = Int }
  # int32: JsonUpdate(td::int32 id, ...), and get_integer_arg for getUpdates offset
  update_id { integer = Int }
  "getUpdates.offset" { integer = Int }
  # int32: td_api accent color ids
  accent_color_id { integer = Int }
  profile_accent_color_id { integer = Int }
  # int32: get_integer_arg / get_required_int_field; some descriptions also say "Signed 32-bit identifier"
  request_id { integer = Int }
  # int32: poll option indexes
  option_ids { integer = Int }
  correct_option_ids { integer = Int }

  # A Unix time, though the description doesn't say so
  send_date { integer = Long }

  # The docs only say "Optional. For “pre” only", as for every other variant's field, but a pre may have no language.
  "MessageEntity.language" { optional = true }
}

# A type key names a type in the docs, or one declared here with items.
#
#   merge = [<types>]  (on a sum type in the docs; so is extra-items)
#     A sum type's items join this type's, and it's dropped: a field of its type gets this one. A standalone type
#     joins as an item itself. Merges don't chain: a type is merged into one type, which isn't merged itself.
#   extra-items = [{ name, desc, tag, fields = [{ name, type, desc }] }]
#     Items the docs don't list. Each is tagged with type = tag.
#   A tagged type (one whose type field is fixed) has to end up an item of a sum type, or the scrape fails.
#   items = [<types>]
#     Declares a sum type the docs don't have, of these (untagged) items. A docs type that's a union of types ("A or
#     B", "A, B and C") becomes the sum type whose items include all of them, so a union with no such type, or several,
#     fails the scrape.
#   split-by-type = true
#     The docs give one object whose type field lists its values, and whose optional fields say "For “X” only". It
#     becomes a sum type with a variant per value, holding the fields for that value.
types {
  # sendPoll's media params take an InputPollMedia, and InputPollOption's an InputPollOptionMedia: both are subsets of
  # the InputMedia* types, so a single InputMedia serves them all. The docs list InputMediaVoiceNote in no sum type,
  # though InputRichMessageMedia.media takes it among the others.
  InputMedia { merge = [InputPollMedia, InputPollOptionMedia, InputMediaVoiceNote] }
  RichText {
    # Telegram sends a plain text as a bare string and a concatenation as an array; see the custom RichText codecs in
    # iozhik/src/main/resources/tgbotapi.conf.
    extra-items = [
      { name = RichTextPlain, desc = "Plain text.", tag = plain, fields = [{ name = text, type = String, desc = "The text" }] }
      { name = RichTextConcat, desc = "Concatenation of rich texts.", tag = concat, fields = [{ name = texts, type = "List[RichText]", desc = "The texts" }] }
    ]
  }
  # The reply_markup params' "InlineKeyboardMarkup or ReplyKeyboardMarkup or ReplyKeyboardRemove or ForceReply"
  KeyboardMarkup { items = [InlineKeyboardMarkup, ReplyKeyboardMarkup, ReplyKeyboardRemove, ForceReply] }
  # The docs give one MessageEntity, whose url, user, language and custom_emoji_id apply to one type each.
  MessageEntity { split-by-type = true }
}
